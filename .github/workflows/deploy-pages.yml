name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "test/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

      - name: Stamp app version
        run: printf 'globalThis.HEXABLOOM_VERSION = "%s";\n' "$GITHUB_SHA" > app/version.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload app
        uses: actions/upload-pages-artifact@v3
        with:
          path: app

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
